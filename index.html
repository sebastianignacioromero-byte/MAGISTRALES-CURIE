/* ---- Pick-Up (pedidos con tag plazo-vencido) ---- */
let pickupSubTab = 'pendientes';
function setPickupSubTab(t){ pickupSubTab = t; render(); }
function renderPickupTab(c){
  const pendientes = state.pickup.filter(p=>p.estado==='pendiente');
  const fisicos = state.pickup.filter(p=>p.estado==='fisico');
  const noFisicos = state.pickup.filter(p=>p.estado==='no_fisico');
  const porMarca = (a,b)=> new Date(b.marcadoAt)-new Date(a.marcadoAt);
  c.innerHTML = `
    <div class="row-between">
      <div>
        <h2 class="titulo">Pick-Up</h2>
        <p class="subt">Pedidos con el tag plazo-vencido, recibidos automáticamente desde Shopify.</p>
      </div>
    </div>
    <div class="subtabs">
      <button class="subtab-btn ${pickupSubTab==='pendientes'?'active':''}" onclick="setPickupSubTab('pendientes')">Pendientes${pendientes.length ? ` <span class="subtab-badge">${pendientes.length}</span>` : ''}</button>
      <button class="subtab-btn ${pickupSubTab==='fisico'?'active':''}" onclick="setPickupSubTab('fisico')">Está Físicamente</button>
      <button class="subtab-btn ${pickupSubTab==='no_fisico'?'active':''}" onclick="setPickupSubTab('no_fisico')">No Está Físicamente</button>
    </div>
    ${pickupSubTab==='pendientes' ? (pendientes.length ? pendientes.map(p => `
      <div class="pedido-card compacto" style="cursor:default;">
        <span class="pedido-num">#${escapeHtml(p.numero)}</span>
        <span class="pedido-prod">${fmtDateShort(p.createdAt)}</span>
        <button class="confirmar-btn" onclick="marcarPickup('${p.id}','fisico')">Está Físicamente</button>
        <button class="confirmar-btn pickup-no" onclick="marcarPickup('${p.id}','no_fisico')">No Está Físicamente</button>
      </div>
    `).join('') : '<div class="empty-state">No hay pedidos pendientes de revisar.</div>') : ''}
    ${pickupSubTab==='fisico' ? pickupRegistroHtml(fisicos.sort(porMarca), 'No hay pedidos marcados como "Está Físicamente".') : ''}
    ${pickupSubTab==='no_fisico' ? pickupRegistroHtml(noFisicos.sort(porMarca), 'No hay pedidos marcados como "No Está Físicamente".') : ''}
  `;
}
function pickupRegistroHtml(lista, vacio){
  return lista.length ? lista.map(p => `
    <div class="pedido-card compacto" style="cursor:default;">
      <span class="pedido-num">#${escapeHtml(p.numero)}</span>
      <span class="pedido-prod">Marcado por ${escapeHtml(p.marcadoPor||'—')} · ${fmtDateShort(p.marcadoAt)}</span>
      <button class="link" onclick="marcarPickup('${p.id}','pendiente')">↩ Deshacer</button>
    </div>
  `).join('') : `<div class="empty-state">${vacio}</div>`;
}
async function marcarPickup(id, estado){
  const p = state.pickup.find(x=>x.id===id);
  if(!p) return;
  p.estado = estado;
  p.marcadoPor = estado==='pendiente' ? null : (state.whoami||'—');
  p.marcadoAt = estado==='pendiente' ? null : new Date().toISOString();
  await storageSet('pickup:list', state.pickup, true);
  render();
}

async function marcarRecetaDigitalOk(id, checked){

/* ---- Avance de pedidos ---- */
function renderAvanceTab(c){
  c.innerHTML = `
    <h2 class="titulo">Avance de pedidos</h2>
    <p class="subt">Hasta qué número de pedido está recolectado y hasta cuál está armado. Cualquiera del equipo puede actualizarlo.</p>
    <div class="avance-grid">
      ${avanceCardHtml('recolectado','Recolectado hasta el pedido')}
      ${avanceCardHtml('armado','Armado hasta el pedido')}
      ${avanceCardHtml('revisado','Recetas revisadas hasta el pedido')}
    </div>
  `;
}
function avanceCardHtml(tipo, label){
  const d = state.avance[tipo] || {numero:'',updatedAt:null,updatedBy:null};
  return `
    <div class="avance-card ${tipo}">
      <div class="avance-label">${label}</div>
      <div class="avance-num">${d.numero ? '#'+escapeHtml(d.numero) : '—'}</div>
      <div class="avance-meta">${d.updatedAt ? 'Actualizado por '+escapeHtml(d.updatedBy||'—')+' · '+fmtDateShort(d.updatedAt) : 'Aún no se ha registrado'}</div>
      <div class="avance-form">
        <input type="text" id="avance-input-${tipo}" placeholder="N° de pedido">
        <button class="primary" onclick="actualizarAvance('${tipo}')">Actualizar</button>
      </div>
    </div>
  `;
}
async function actualizarAvance(tipo){
  const input = document.getElementById('avance-input-'+tipo);
  const numero = input.value.trim();
  if(!numero) return;
  state.avance[tipo] = {numero, updatedAt:new Date().toISOString(), updatedBy: state.whoami||'—'};
  state.avanceHistorial.unshift({tipo, numero, updatedAt:state.avance[tipo].updatedAt, updatedBy:state.avance[tipo].updatedBy});
  state.avanceHistorial = state.avanceHistorial.slice(0,300);
  await Promise.all([
    storageSet('avance:estado', state.avance, true),
    storageSet('avance:historial', state.avanceHistorial, true)
  ]);
  render();
}

/* ---- Calendario ---- */
function renderCalendarioTab(c){
  const anio = state.calAnio, mes = state.calMes;
  const primerDia = new Date(anio, mes, 1);
  const diasEnMes = new Date(anio, mes+1, 0).getDate();
  const offset = primerDia.getDay();
  const hoy = todayStr();
  let celdas = '';
  for(let i=0;i<offset;i++){ celdas += `<div class="cal-celda vacia"></div>`; }
  for(let d=1; d<=diasEnMes; d++){
    const fechaStr = anio+'-'+String(mes+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const nota = state.calNotas[fechaStr];
    celdas += `
      <div class="cal-celda ${fechaStr===hoy?'hoy':''} ${nota?'con-nota':''}" onclick="openDiaModal('${fechaStr}')">
        <div class="cal-num">${d}</div>
        ${nota ? `<div class="cal-preview">${escapeHtml(nota.slice(0,40))}${nota.length>40?'…':''}</div>` : ''}
      </div>`;
  }
  c.innerHTML = `
    <div class="row-between">
      <div>
        <h2 class="titulo">Calendario</h2>
        <p class="subt">Programaciones y anotaciones futuras del equipo, por día.</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="ghost" onclick="cambiarMesCal(-1)">← Mes anterior</button>
        <div style="font-weight:700;font-size:14px;min-width:150px;text-align:center;text-transform:capitalize;color:var(--turquesa-osc);">${MESES[mes]} ${anio}</div>
        <button class="ghost" onclick="cambiarMesCal(1)">Mes siguiente →</button>
      </div>
    </div>
    <div class="cal-grid cal-header">
      ${['dom','lun','mar','mié','jue','vie','sáb'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${celdas}</div>
  `;
}
function cambiarMesCal(delta){
  let mes = state.calMes + delta;
  let anio = state.calAnio;
  if(mes<0){ mes=11; anio--; }
  if(mes>11){ mes=0; anio++; }
  state.calMes = mes; state.calAnio = anio;
  renderCalendarioTab(document.getElementById('content'));
}
function openDiaModal(fechaStr){
  const nota = state.calNotas[fechaStr] || '';
  const [y,m,d] = fechaStr.split('-');
  const fechaLegible = fmtFecha(new Date(+y, +m-1, +d));
  showModal(`
    <h3>${fechaLegible}</h3>
    <div class="field">
      <label class="field-label">Programación / notas para este día</label>
      <textarea id="cal-nota" rows="6" placeholder="Ej: llega pedido especial, turno de alguien, recordatorio...">${escapeHtml(nota)}</textarea>
    </div>
    <div class="modal-actions">
      ${nota ? `<button class="danger-link" style="margin-right:auto;" onclick="borrarDiaNota('${fechaStr}')">Eliminar</button>` : ''}
      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="guardarDiaNota('${fechaStr}')">Guardar</button>
    </div>
  `);
}
async function guardarDiaNota(fechaStr){
  const texto = document.getElementById('cal-nota').value.trim();
  if(texto){ state.calNotas[fechaStr] = texto; } else { delete state.calNotas[fechaStr]; }
  await storageSet('calendario:notas', state.calNotas, true);
  closeModal(); render();
}
async function borrarDiaNota(fechaStr){
  delete state.calNotas[fechaStr];
  await storageSet('calendario:notas', state.calNotas, true);
  closeModal(); render();
}

async function renderHistorialTab(c){
  c.innerHTML = `
    <h2 class="titulo">Historial</h2>
    <p class="subt">Trazabilidad de los últimos 30 días: checklist por fecha, y todo lo completado o resuelto.</p>
    <div class="field" style="max-width:220px;">
      <label class="field-label">Ver checklist del día</label>
      <input type="date" id="hist-fecha" value="${state.histFecha}" onchange="loadHistFecha(this.value)">
    </div>
    <div id="hist-checklist"></div>
    <h2 class="titulo" style="margin-top:26px;">Registro (últimos 30 días)</h2>
    <div class="tabla-wrap"><table class="hist-tabla">
      <thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th>Responsable</th><th>Estado</th></tr></thead>
      <tbody id="hist-body"></tbody>
    </table></div>
  `;
  await loadHistFecha(state.histFecha);
  renderHistLog();
}
async function loadHistFecha(fecha){
  state.histFecha = fecha;
  const el = document.getElementById('hist-checklist');
  const data = await storageGet('checklist:'+fecha, true, null);
  if(!data){ el.innerHTML = '<div class="empty-state">Sin datos de checklist para esta fecha.</div>'; return; }
  el.innerHTML = `<div class="card" style="border-left-color:var(--turquesa);padding:4px 16px;">
    ${data.map(item=>`
      <div class="checklist-item ${item.done?'done':''}">
        <span style="width:17px;text-align:center;">${item.done?'✓':'—'}</span>
        <div class="texto">${escapeHtml(item.text)}</div>
        ${item.done ? `<div class="meta">${escapeHtml(item.doneBy||'')} · ${fmtDateShort(item.doneAt)}</div>` : ''}
      </div>
    `).join('')}
  </div>`;
}
function renderHistLog(){
  const cutoff = Date.now() - 30*24*60*60*1000;
  const rows = [];
  state.pendientes.filter(p=>p.estado==='hecho' && p.completedAt && new Date(p.completedAt).getTime()>cutoff).forEach(p=>{
    rows.push({fecha:p.completedAt, tipo:'Pendiente', desc:p.text, resp:p.completedBy, estado:'Completado'});
  });
  state.avanceHistorial.filter(a=> new Date(a.updatedAt).getTime()>cutoff).forEach(a=>{
    rows.push({fecha:a.updatedAt, tipo: a.tipo==='recolectado'?'Avance recolectado':'Avance armado', desc:'Pedido #'+a.numero, resp:a.updatedBy, estado:'Actualizado'});
  });
  rows.sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  const body = document.getElementById('hist-body');
  body.innerHTML = rows.length ? rows.map(r=>`
    <tr><td>${fmtDateShort(r.fecha)}</td><td>${r.tipo}</td><td>${escapeHtml(r.desc)}</td><td>${escapeHtml(r.resp||'—')}</td><td>${r.estado}</td></tr>
  `).join('') : '<tr><td colspan="5" style="color:var(--texto-suave);padding:16px 10px;">Sin actividad registrada en los últimos 30 días.</td></tr>';
}

function rmMesVacio(){
  const o = {};
  RM_FIELDS.forEach(f => o[f] = (f.startsWith('obs_') || f==='responsable') ? '' : 0);
  return o;
}
function rmMesLegible(mesStr){
  if(!mesStr) return '\u2014';
  const partes = mesStr.split('-');
  const y = partes[0], m = partes[1];
  const idx = parseInt(m,10)-1;
  const nombre = MESES[idx] ? MESES[idx].slice(0,3) : m;
  return nombre + ' ' + y;
}

  rmMontado = true;

async function renderReporteGate(c){
  c.innerHTML = '<div class="loading">Cargando\u2026</div>';

  if(!codigoActual){

async function rmCrearCodigo(){
  const val = document.getElementById('rm-nuevo-codigo').value.trim();
  if(!val) return;
  await storageSet('reporte:codigo', val, true);
  rmDesbloqueado = true;
  render();
}

async function rmVerificarCodigo(){
  const val = document.getElementById('rm-codigo-input').value.trim();
  const codigoActual = await storageGet('reporte:codigo', true, '');
  if(val && val === codigoActual){
    rmDesbloqueado = true;
    render();
  } else {
    const err = document.getElementById('rm-gate-error');
    if(err) err.textContent = 'Código incorrecto.';
  }
}

async function rmCambiarCodigo(){
  const actual = prompt('Ingresa el código actual para confirmarlo:');
  if(actual===null) return;
  const codigoActual = await storageGet('reporte:codigo', true, '');
  if(actual.trim() !== codigoActual){ alert('El código actual no coincide.'); return; }
  const nuevo = prompt('Ingresa el nuevo código:');
  if(!nuevo || !nuevo.trim()) return;
  await storageSet('reporte:codigo', nuevo.trim(), true);
  alert('Código actualizado.');
}
function rmBloquear(){
  rmDesbloqueado = false;
  rmMontado = false;
  render();
}

async function cambiarMesReporte(mes){
  await cargarReporteMes(mes);
}

async function cargarReporteMes(mes){
  rmMes = mes;
  const vacio = rmMesVacio();
  const data = await storageGet('reporte:'+mes, true, vacio);
  rmData = Object.assign({}, vacio, data);
  pintarReporte();
  await rmActualizarTendencia();
}

function rmOnInput(){

function rmN(id){ const el=document.getElementById('rm_'+id); return el ? (parseFloat(el.value)||0) : 0; }
function rmPct(a,b){ return b>0 ? ((a/b)*100).toFixed(1)+'%' : '\u2014'; }
function rmMoney(v){ return '$'+Math.round(v).toLocaleString('es-CL'); }
function rmSetText(id,val){ const el=document.getElementById('rm_'+id); if(el) el.textContent=val; }

function rmRecalc(){
  const pTotal = rmN('p_total');
  const pOkSem=rmN('p_ok_sem'), pOkFds=rmN('p_ok_fds');
  const pReiSem=rmN('p_rei_sem'), pReiFds=rmN('p_rei_fds');
  const pEprSem=rmN('p_epr_sem'), pEprFds=rmN('p_epr_fds');
  const pIncSem=rmN('p_inc_sem'), pIncFds=rmN('p_inc_fds');
  const pReiCostSem=rmN('p_rei_cost_sem'), pReiCostFds=rmN('p_rei_cost_fds');
  const pEprCostSem=rmN('p_epr_cost_sem'), pEprCostFds=rmN('p_epr_cost_fds');
  const pIncCostSem=rmN('p_inc_cost_sem'), pIncCostFds=rmN('p_inc_cost_fds');
  const pReiCost=pReiCostSem+pReiCostFds, pEprCost=pEprCostSem+pEprCostFds, pIncCost=pIncCostSem+pIncCostFds;

  const pOkTot=pOkSem+pOkFds, pReiTot=pReiSem+pReiFds, pEprTot=pEprSem+pEprFds, pIncTot=pIncSem+pIncFds;
  const pVerSem=pOkSem+pReiSem+pEprSem+pIncSem;
  const pVerFds=pOkFds+pReiFds+pEprFds+pIncFds;
  const pVerTot=pOkTot+pReiTot+pEprTot+pIncTot;
  const pErrTot=pReiTot+pEprTot+pIncTot;
  const pCostTotSem=pReiCostSem+pEprCostSem+pIncCostSem;
  const pCostTotFds=pReiCostFds+pEprCostFds+pIncCostFds;
  const pCostTot=pReiCost+pEprCost+pIncCost;

  rmSetText('p_ok_tot', pOkTot);
  rmSetText('p_rei_tot', pReiTot);
  rmSetText('p_epr_tot', pEprTot);
  rmSetText('p_inc_tot', pIncTot);
  rmSetText('p_rei_cost_tot', rmMoney(pReiCost));
  rmSetText('p_epr_cost_tot', rmMoney(pEprCost));
  rmSetText('p_inc_cost_tot', rmMoney(pIncCost));
  rmSetText('p_ok_pct', rmPct(pOkTot,pTotal));
  rmSetText('p_rei_pct', rmPct(pReiTot,pTotal));
  rmSetText('p_epr_pct', rmPct(pEprTot,pTotal));
  rmSetText('p_inc_pct', rmPct(pIncTot,pTotal));
  rmSetText('p_ver_sem', pVerSem);
  rmSetText('p_ver_fds', pVerFds);
  rmSetText('p_ver_tot', pVerTot);
  rmSetText('p_ver_cost_sem', rmMoney(pCostTotSem));
  rmSetText('p_ver_cost_fds', rmMoney(pCostTotFds));
  rmSetText('p_ver_cost', rmMoney(pCostTot));

  const pMatchEl=document.getElementById('rm_p_ver_match');
  const pStatusEl=document.getElementById('rm_p_ver_status');
  if(pTotal>0 && pMatchEl && pStatusEl){
    pMatchEl.textContent = pVerTot===pTotal ? '\u2705 Cuadra' : ('\u26a0\ufe0f Diff ' + (pVerTot-pTotal));
    pStatusEl.innerHTML = pVerTot===pTotal ? '<span class="rm-badge rm-badge-verde">Verificado</span>' : '<span class="rm-badge rm-badge-rojo">Diferencia</span>';
  }
  rmSetText('p_tasa_error', rmPct(pErrTot,pTotal));
  rmSetText('p_costo_total', rmMoney(pCostTot));

  const rTotal=rmN('r_total');
  const rOk=rmN('r_ok');
  const rRei=rmN('r_rei'), rReiCostSem=rmN('r_rei_cost_sem'), rReiCostFds=rmN('r_rei_cost_fds');
  const rPer=rmN('r_per'), rPerCostSem=rmN('r_per_cost_sem'), rPerCostFds=rmN('r_per_cost_fds');
  const rEmed=rmN('r_emed'), rEmedCostSem=rmN('r_emed_cost_sem'), rEmedCostFds=rmN('r_emed_cost_fds');
  const rInc=rmN('r_inc'), rIncCostSem=rmN('r_inc_cost_sem'), rIncCostFds=rmN('r_inc_cost_fds');
  const rReiCost=rReiCostSem+rReiCostFds, rPerCost=rPerCostSem+rPerCostFds, rEmedCost=rEmedCostSem+rEmedCostFds, rIncCost=rIncCostSem+rIncCostFds;

  const rVerTot=rOk+rRei+rPer+rEmed+rInc;
  const rErrTot=rRei+rPer+rEmed+rInc;
  const rCostTotSem=rReiCostSem+rPerCostSem+rEmedCostSem+rIncCostSem;
  const rCostTotFds=rReiCostFds+rPerCostFds+rEmedCostFds+rIncCostFds;
  const rCostTot=rReiCost+rPerCost+rEmedCost+rIncCost;

  rmSetText('r_ok_pct', rmPct(rOk,rTotal));
  rmSetText('r_rei_pct', rmPct(rRei,rTotal));
  rmSetText('r_per_pct', rmPct(rPer,rTotal));
  rmSetText('r_emed_pct', rmPct(rEmed,rTotal));
  rmSetText('r_inc_pct', rmPct(rInc,rTotal));
  rmSetText('r_rei_cost_tot', rmMoney(rReiCost));
  rmSetText('r_per_cost_tot', rmMoney(rPerCost));
  rmSetText('r_emed_cost_tot', rmMoney(rEmedCost));
  rmSetText('r_inc_cost_tot', rmMoney(rIncCost));
  rmSetText('r_ver_tot', rVerTot);
  rmSetText('r_ver_cost_sem', rmMoney(rCostTotSem));
  rmSetText('r_ver_cost_fds', rmMoney(rCostTotFds));
  rmSetText('r_ver_cost', rmMoney(rCostTot));

  const rMatchEl=document.getElementById('rm_r_ver_match');
  const rStatusEl=document.getElementById('rm_r_ver_status');
  if(rTotal>0 && rMatchEl && rStatusEl){
    rMatchEl.textContent = rVerTot===rTotal ? '\u2705 Cuadra' : ('\u26a0\ufe0f Diff ' + (rVerTot-rTotal));
    rStatusEl.innerHTML = rVerTot===rTotal ? '<span class="rm-badge rm-badge-verde">Verificado</span>' : '<span class="rm-badge rm-badge-rojo">Diferencia</span>';
  }
  rmSetText('r_tasa_error', rmPct(rErrTot,rTotal));
  rmSetText('r_costo_total', rmMoney(rCostTot));

  const gTotal=pTotal+rTotal, gOk=pOkTot+rOk, gErrTot=pErrTot+rErrTot, gCostTot=pCostTot+rCostTot;
  rmSetText('kpi_total', gTotal||'\u2014');
  rmSetText('kpi_ok', gOk||'\u2014');
  rmSetText('kpi_ok_pct', gTotal>0 ? (rmPct(gOk,gTotal)+' sin incidentes') : '\u2014');
  rmSetText('kpi_error_total', rmPct(gErrTot,gTotal));
  rmSetText('kpi_costo_total', rmMoney(gCostTot));
  rmSetText('kpi_pct_propios', rmPct(pTotal,gTotal));
  rmSetText('kpi_pct_region', rmPct(rTotal,gTotal));

  const propBarsEl=document.getElementById('rm_prop_bars');
  if(propBarsEl){
    propBarsEl.innerHTML = pTotal>0 ? rmBars([
      {label:'Sin incidente', val:pOkTot, total:pTotal, color:'#1f8a5f'},
      {label:'Reintento', val:pReiTot, total:pTotal, color:'var(--naranjo)'},
      {label:'Error producto', val:pEprTot, total:pTotal, color:'#c0392b'},
      {label:'Incompleto', val:pIncTot, total:pTotal, color:'var(--turquesa)'},
    ]) : '\u2014';
  }
  const regBarsEl=document.getElementById('rm_reg_bars');
  if(regBarsEl){
    regBarsEl.innerHTML = rTotal>0 ? rmBars([
      {label:'Entregado OK', val:rOk, total:rTotal, color:'#1f8a5f'},
      {label:'Re-enviado', val:rRei, total:rTotal, color:'var(--naranjo)'},
      {label:'Perdido', val:rPer, total:rTotal, color:'#c0392b'},
      {label:'Error medic.', val:rEmed, total:rTotal, color:'var(--turquesa)'},
      {label:'Incompleto', val:rInc, total:rTotal, color:'var(--turquesa-osc)'},
    ]) : '\u2014';
  }

  rmUpdateCharts(pReiTot,pEprTot,pIncTot,pOkTot, rRei,rPer,rEmed,rInc,rOk);
  rmUpdateAlerts(pErrTot,pTotal, rErrTot,rTotal, rPer, pEprTot, pIncTot);

  if(rmData){
    RM_FIELDS.forEach(f=>{
      const el=document.getElementById('rm_'+f);
      if(el) rmData[f]=el.value;
    });
  }
}

function rmBars(items){
  return items.map(i => {
    const p = i.total>0 ? ((i.val/i.total)*100).toFixed(1) : 0;
    return '<div><div class="rm-progress-label"><span>'+i.label+'</span><span>'+i.val+' ('+p+'%)</span></div><div class="rm-progress-bar"><div class="rm-progress-fill" style="width:'+p+'%;background:'+i.color+'"></div></div></div>';
  }).join('');
}

function rmCssVar(name, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}

function rmUpdateCharts(pRei,pEpr,pInc,pOk, rRei,rPer,rEmed,rInc,rOk){
  const turquesa = rmCssVar('--turquesa','#0b6f68');
  const naranjo = rmCssVar('--naranjo','#ef6c00');
  const turquesaOsc = rmCssVar('--turquesa-osc','#074c47');

  const elP = document.getElementById('rm_chartPropios');
  if(elP){
    if(rmChartPropios) rmChartPropios.destroy();
    rmChartPropios = new Chart(elP, {
      type: 'doughnut',
      data: {
        labels: ['Sin incidente','Reintento','Error producto','Incompleto'],
        datasets: [{ data: [pOk,pRei,pEpr,pInc], backgroundColor: ['#1f8a5f',naranjo,'#c0392b',turquesa], borderWidth: 2, borderColor: '#fff' }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 12 } } } }
    });
  }

  const elR = document.getElementById('rm_chartRegion');
  if(elR){
    if(rmChartRegion) rmChartRegion.destroy();
    rmChartRegion = new Chart(elR, {
      type: 'doughnut',
      data: {
        labels: ['Entregado OK','Re-enviado','Perdido','Error medic.','Incompleto'],
        datasets: [{ data: [rOk,rRei,rPer,rEmed,rInc], backgroundColor: ['#1f8a5f',naranjo,'#c0392b',turquesa,turquesaOsc], borderWidth: 2, borderColor: '#fff' }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 12 } } } }
    });
  }
}

function rmUpdateAlerts(pErr,pTot, rErr,rTot, rPer, pEpr, pInc){
  const alerts = [];
  const pRate = pTot>0 ? (pErr/pTot)*100 : 0;
  const rRate = rTot>0 ? (rErr/rTot)*100 : 0;

  if(pRate>=10) alerts.push({color:'rojo', text: '\u26a0\ufe0f Tasa error propios supera 10% (' + pRate.toFixed(1) + '%)'});
  else if(pRate>=5) alerts.push({color:'ambar', text: '\u26a1 Tasa error propios entre 5-10% (' + pRate.toFixed(1) + '%)'});
  else if(pTot>0) alerts.push({color:'verde', text: '\u2705 Tasa error propios dentro de rango (' + pRate.toFixed(1) + '%)'});

  if(rRate>=10) alerts.push({color:'rojo', text: '\u26a0\ufe0f Tasa error regi\u00f3n supera 10% (' + rRate.toFixed(1) + '%)'});
  else if(rRate>=5) alerts.push({color:'ambar', text: '\u26a1 Tasa error regi\u00f3n entre 5-10% (' + rRate.toFixed(1) + '%)'});
  else if(rTot>0) alerts.push({color:'verde', text: '\u2705 Tasa error regi\u00f3n dentro de rango (' + rRate.toFixed(1) + '%)'});

  if(rPer>0) alerts.push({color:'rojo', text: '\u274c ' + rPer + ' pedido(s) perdido(s) en regi\u00f3n \u2014 requiere acci\u00f3n'});
  if(pEpr>0) alerts.push({color:'ambar', text: '\ud83d\udc8a ' + pEpr + ' error(es) de producto en propios'});
  if(pInc>0) alerts.push({color:'ambar', text: '\ud83d\udce6 ' + pInc + ' pedido(s) incompleto(s) en propios'});

  const panel = document.getElementById('rm_alert_panel');
  if(!panel) return;
  panel.innerHTML = alerts.length
    ? alerts.map(a => '<div class="rm-alert ' + a.color + '">' + a.text + '</div>').join('')
    : '<div style="color:var(--texto-suave);font-size:12.5px;padding:8px;">Ingresa datos para ver alertas autom\u00e1ticas.</div>';
}

async function rmActualizarTendencia(){
  const body = document.getElementById('rm_trend_body');
  if(!body) return;
  body.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--texto-suave);padding:14px;">Cargando\u2026</td></tr>';
  let filas = [];
  try{
    const { data, error } = await sb.from('kv_store').select('key,value').like('key','reporte:%').order('key');
    if(error) throw error;
    filas = (data||[]).map(row => {
      const mes = row.key.replace('reporte:','');
      const v = row.value || {};
      const num = x => parseFloat(x) || 0;
      const pTotal = num(v.p_total);
      const pOkTot = num(v.p_ok_sem) + num(v.p_ok_fds);
      const pReiTot = num(v.p_rei_sem) + num(v.p_rei_fds);
      const pEprTot = num(v.p_epr_sem) + num(v.p_epr_fds);
      const pIncTot = num(v.p_inc_sem) + num(v.p_inc_fds);
      const pErrTot = pReiTot + pEprTot + pIncTot;
      const pCost = num(v.p_rei_cost_sem)+num(v.p_rei_cost_fds)+num(v.p_epr_cost_sem)+num(v.p_epr_cost_fds)+num(v.p_inc_cost_sem)+num(v.p_inc_cost_fds);
      const rTotal = num(v.r_total);
      const rOk = num(v.r_ok);
      const rRei = num(v.r_rei), rPer = num(v.r_per), rEmed = num(v.r_emed), rInc = num(v.r_inc);
      const rErrTot = rRei + rPer + rEmed + rInc;
      const rCost = num(v.r_rei_cost_sem)+num(v.r_rei_cost_fds)+num(v.r_per_cost_sem)+num(v.r_per_cost_fds)+num(v.r_emed_cost_sem)+num(v.r_emed_cost_fds)+num(v.r_inc_cost_sem)+num(v.r_inc_cost_fds);
      return {
        mes, pTotal, pErrPct: pTotal>0 ? (pErrTot/pTotal*100) : 0, pCost,
        rTotal, rErrPct: rTotal>0 ? (rErrTot/rTotal*100) : 0, rCost,
        costoTotal: pCost+rCost, tieneD: pTotal>0 || rTotal>0
      };
    }).filter(f => f.tieneD);
  }catch(e){ console.error('error cargando tendencia', e); }

  if(!filas.length){
    body.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--texto-suave);padding:14px;">A\u00fan no hay meses guardados para comparar.</td></tr>';
  } else {
    body.innerHTML = filas.map(f => (
      '<tr><td>'+rmMesLegible(f.mes)+'</td><td class="num">'+f.pTotal+'</td><td class="num">'+f.pErrPct.toFixed(1)+'%</td><td class="num">'+rmMoney(f.pCost)+'</td><td class="num">'+f.rTotal+'</td><td class="num">'+f.rErrPct.toFixed(1)+'%</td><td class="num">'+rmMoney(f.rCost)+'</td><td class="num">'+rmMoney(f.costoTotal)+'</td></tr>'
    )).join('');
  }

  const turquesa = rmCssVar('--turquesa','#0b6f68');
  const naranjo = rmCssVar('--naranjo','#ef6c00');
  const labels = filas.map(f => rmMesLegible(f.mes));

  const elT1 = document.getElementById('rm_chartTrend1');
  if(elT1){
    if(rmChartTrend1) rmChartTrend1.destroy();
    rmChartTrend1 = new Chart(elT1, {
      type: 'line',
      data: { labels, datasets: [
        { label: 'Error propios %', data: filas.map(f=>f.pErrPct.toFixed(1)), borderColor: turquesa, backgroundColor: 'rgba(11,111,104,0.12)', tension: 0.3, fill: true },
        { label: 'Error regi\u00f3n %', data: filas.map(f=>f.rErrPct.toFixed(1)), borderColor: naranjo, backgroundColor: 'rgba(239,108,0,0.12)', tension: 0.3, fill: true, borderDash: [4,3] },
      ]},
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } }, plugins: { legend: { labels: { font: { size: 11 } } } } }
    });
  }
  const elT2 = document.getElementById('rm_chartTrend2');
  if(elT2){
    if(rmChartTrend2) rmChartTrend2.destroy();
    rmChartTrend2 = new Chart(elT2, {
      type: 'bar',
      data: { labels, datasets: [
        { label: 'Costo propios $', data: filas.map(f=>f.pCost), backgroundColor: turquesa },
        { label: 'Costo regi\u00f3n $', data: filas.map(f=>f.rCost), backgroundColor: naranjo },
      ]},
      options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }, plugins: { legend: { labels: { font: { size: 11 } } } } }
    });
  }
}

async function rmGuardar(){
  if(!rmData) return;
  await storageSet('reporte:'+rmMes, rmData, true);
  await rmActualizarTendencia();
}

function rmExportJSON(){
  if(!rmData) return;
  const data = JSON.stringify(rmData, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'reporte_farmacia_' + rmMes + '.json';
  a.click();
}

async function rmLimpiarMes(){
  if(!confirm('\u00bfLimpiar todos los datos del reporte de este mes? Esta acci\u00f3n no se puede deshacer.')) return;
  rmData = rmMesVacio();
  await storageSet('reporte:'+rmMes, rmData, true);
  pintarReporte();
  await rmActualizarTendencia();
}

  if(!email) return '';
  const local = email.split('@')[0];
  return local.split(/[._-]+/).map(w => w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}

function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeJs(str){ return String(str).replace(/'/g,"\\'"); }

function aplicarCambioRemoto(key, value){
  if(key==='abastecimiento:maestro'){ abRecargarMaestro(); return; }
  if(key.startsWith('abastecimiento:resueltos:') || key.startsWith('abastecimiento:rechazados:')){ abRemotoArchivo(key); return; }
  if(pendingSaves[key]) return; // no pisar un cambio local que todavía no se guardó
  if(value===undefined) return;
  if(key==='shopify:entrantes'){
    if(Array.isArray(value) && value.length) procesarEntrantesShopify();
    return;
  }
  if(key.startsWith('shopify:entrantes:pickup')){
    if(value && (!Array.isArray(value) || value.length)) procesarEntrantesPickup();
    return;
  }
  if(key==='pendientes:list') state.pendientes = value;
  else if(key==='notas:list') state.notas = value;
  else if(key==='pedidos:list') state.pedidos = value;
  else if(key==='stickers:list') state.stickers = value;
  else if(key==='recetasdigitales:list') state.recetasDigitales = value;
  else if(key==='pedidossinreceta:list') state.pedidosSinReceta = value;
  else if(key==='stickerssinrespuesta:list') state.stickersSinRespuesta = value;
  else if(key==='repartidores:list') state.repartidores = value;
  else if(key==='feriados:list') state.feriados = value;
  else if(key==='avance:estado') state.avance = value;
  else if(key==='avance:historial') state.avanceHistorial = value;
  else if(key==='checklist:'+todayStr()) state.checklistToday = value;
  else if(key==='calendario:notas') state.calNotas = value;
  else if(key==='abastecimiento:list') abAplicarRemota(value);
  else if(key==='pickup:list') state.pickup = value;
  else return;
  if(!document.querySelector('.modal-overlay')) render();
}
function setupRealtime(){
  realtimeChannel = sb
    .channel('kv_store_changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'kv_store'}, (payload) => {
      const row = payload.new && Object.keys(payload.new).length ? payload.new : payload.old;
      if(!row || !row.key) return;
      aplicarCambioRemoto(row.key, payload.new ? payload.new.value : undefined);
    })
    .subscribe();
}

/* ---- Abastecimiento ----
   Productos faltantes por pedido, con el SKU completado desde el maestro de Bsale.
   Filas en 'abastecimiento:list' y maestro en 'abastecimiento:maestro' (kv_store, compartidos por todo el equipo).
   Mientras la pestaña está montada se refresca solo la tabla, y nunca mientras alguien escribe en ella. */
const AB_PLATAFORMAS = ['WEB','BUHO','WHATSAPP'];
const AB_ENVIOS      = ['Despacho','Blue','Pick Up','Whatsapp'];
const AB_PROVEEDORES = ['Mediven','Provefarma','Global','Ñuñoa','Gava','Otro'];
const AB_ESTADOS     = ['Pendiente','Resuelto','Rechazado'];
const AB_XLSX_URL    = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

let abMontado = false;
let abSub = 'pendientes';      // subpestaña: 'pendientes' | 'resueltos' | 'rechazados'
let abResMes = todayStr().slice(0,7);
let abResCache = {};           // 'resueltos:YYYY-MM' / 'rechazados:YYYY-MM' -> filas de ese mes (se bajan solo al verlas)
let abMoviendo = false;
let abSucio = false;            // hay cambios propios esperando guardarse
let abCambios = {};             // id de fila -> Set de campos editados aquí y aún no guardados
let abNuevas = new Set(), abBorradas = new Set();
let abTimerGuardado = null;
let abRefrescoPendiente = false;
let abMaestro = [];             // {n: nombre, k: sku, hn: nombre normalizado, h: nombre+sku normalizados}
let abMaestroInfo = null;       // {fecha, archivo, cargadoPor}
let abMaestroCargado = false;   // ya se pidió el maestro al servidor (se baja solo al abrir la pestaña)
let abMapeo = null;

function abNorm(s){ // minúsculas, sin tildes ni signos: "Ñuñoa" -> "nunoa", "1,4 kg" -> "1 4 kg"
  return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
         .replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
function abClsPlat(v){ return v==='WEB' ? 'web' : (v==='BUHO' ? 'buho' : (v==='WHATSAPP' ? 'wsp' : '')); }
function abClsEst(v){ return v==='Resuelto' ? 'res' : (v==='Rechazado' ? 'rech' : 'pend'); }
function abNuevaFila(){
  return { id:uid(), plataforma:'WEB', envio:'', pedido:'', producto:'', sku:'', skuAuto:false,
           cantidad:'', proveedor:'', obs:'', estado:'Pendiente', creadoPor:state.whoami||'—', creadoAt:new Date().toISOString() };
}
function abCargarXLSX(){
  if(typeof XLSX !== 'undefined') return Promise.resolve();
  return new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = AB_XLSX_URL;
    s.onload = ()=> res();
    s.onerror = ()=> rej(new Error('no se pudo cargar la librería de Excel (¿sin internet?)'));
    document.head.appendChild(s);
  });
}

/* Guardado: con una pausa corta, para no subir la lista completa en cada tecla.
   Si mientras tanto llega la lista de otra persona, se combinan campo por campo (abMezclar)
   en vez de que una de las dos versiones pise a la otra. */
function abMarcar(id, campo){
  (abCambios[id] = abCambios[id] || new Set()).add(campo);
  abGuardar();
}
function abMezclar(remota){
  if(!Array.isArray(remota)) return state.abastecimiento;
  const local = new Map(state.abastecimiento.map(r=>[r.id,r]));
  const out = remota.filter(r=>!abBorradas.has(r.id)).map(r=>{
    const campos = abCambios[r.id], l = local.get(r.id);
    if(!campos || !l) return r;
    const m = Object.assign({}, r);
    campos.forEach(f=>{ m[f] = l[f]; });
    return m;
  });
  state.abastecimiento.forEach(r=>{ if(abNuevas.has(r.id) && !out.some(x=>x.id===r.id)) out.push(r); });
  return out;
}
function abAplicarRemota(val){
  state.abastecimiento = abSucio ? abMezclar(val) : val;
}
function abGuardar(){
  abSucio = true;
  clearTimeout(abTimerGuardado);
  abTimerGuardado = setTimeout(abFlushGuardado, 700);
}
function abFlushGuardado(){
  clearTimeout(abTimerGuardado);
  if(!abSucio) return;
  abSucio = false;
  abCambios = {}; abNuevas = new Set(); abBorradas = new Set();
  storageSet('abastecimiento:list', state.abastecimiento, true);
}
window.addEventListener('beforeunload', abFlushGuardado);

/* Maestro de productos */
function abIndexar(items){
  abMaestro = items.map(([n,k])=>{ const hn = abNorm(n); return { n:n, k:k, hn:hn, h:hn+' '+abNorm(k) }; });
}
async function abRecargarMaestro(){
  if(!abMontado && !abMaestroCargado) return; // nadie lo ha necesitado todavía en esta pestaña del navegador
  try{
    const { data, error } = await sb.from('kv_store').select('value').eq('key','abastecimiento:maestro').maybeSingle();
    if(error) throw error;
    const m = data && data.value;
    if(m && Array.isArray(m.items)){
      abIndexar(m.items);
      abMaestroInfo = { fecha:m.fecha, archivo:m.archivo, cargadoPor:m.cargadoPor };
    }
    abMaestroCargado = true;
  }catch(e){ console.error('no se pudo leer el maestro de abastecimiento', e); }
  abPintarMaestro();
}
function abPintarMaestro(){
  const el = document.getElementById('ab-maestro-st');
  if(!el) return;
  if(abMaestro.length){
    const f = abMaestroInfo && abMaestroInfo.fecha ? fmtDateShort(abMaestroInfo.fecha) : '';
    const quien = abMaestroInfo && abMaestroInfo.cargadoPor ? ' por '+escapeHtml(abMaestroInfo.cargadoPor) : '';
    el.innerHTML = 'Maestro: <b>'+abMaestro.length.toLocaleString('es-CL')+'</b> productos'+(f?' · cargado el '+f+quien:'');
  } else if(!abMaestroCargado){
    el.innerHTML = 'Cargando maestro…';
  } else {
    el.innerHTML = '<span class="ab-sin">Sin maestro cargado: el autocompletado no funciona todavía</span>';
  }
}
function abBuscar(q){
  const tk = abNorm(q).split(' ').filter(Boolean);
  if(!tk.length) return [];
  const out = []; const vistos = new Set();
  for(const it of abMaestro){
    let ok = true;
    for(const t of tk){ if(it.h.indexOf(t) === -1){ ok = false; break; } }
    if(!ok) continue;
    const key = it.n+'|'+it.k;
    if(vistos.has(key)) continue;
    vistos.add(key);
    const s = (it.hn.startsWith(tk[0]) ? 0 : (it.hn.indexOf(' '+tk[0]) !== -1 ? 1 : 2))*1000 + it.n.length;
    out.push({it:it, s:s});
  }
  out.sort((a,b)=>a.s-b.s);
  return out.slice(0,15).map(o=>o.it);
}

/* Lectura del Excel: formato "Stock actual" de Bsale (encabezados "Producto" y "SKU", con filas de título arriba).
   Si el archivo trae otro formato, se eligen las columnas a mano. */
function abEncabezadoExacto(aoa){
  for(let i=0;i<Math.min(30,aoa.length);i++){
    const hs = aoa[i].map(c=>String(c==null?'':c).trim().toLowerCase());
    const iN = hs.indexOf('producto'), iK = hs.indexOf('sku');
    if(iN!==-1 && iK!==-1) return { hr:i, iN:iN, iK:iK };
  }
  return null;
}
function abConstruirItems(aoa, hr, cn, ck, limite){
  const items = [];
  for(let i=hr+1;i<aoa.length;i++){
    const row = aoa[i];
    const n = String(row[cn]==null?'':row[cn]).trim();
    if(!n) continue;
    const k = String(row[ck]==null?'':row[ck]).trim();
    items.push([n,k]);
    if(limite && items.length>=limite) break;
  }
  return items;
}
async function abGuardarMaestro(items, archivo){
  const m = { items:items, fecha:new Date().toISOString(), archivo:archivo, cargadoPor:state.whoami||'—' };
  abIndexar(items);
  abMaestroInfo = { fecha:m.fecha, archivo:m.archivo, cargadoPor:m.cargadoPor };
  abMaestroCargado = true;
  abPintarMaestro();
  const ok = await storageSet('abastecimiento:maestro', m, true);
  if(!ok) alert('El maestro quedó cargado en esta pantalla, pero todavía no se pudo guardar en el servidor. Se seguirá reintentando; si recargas la página antes, habrá que volver a cargarlo.');
}
async function abArchivoMaestro(input){
  const f = input.files[0];
  input.value = '';
  if(!f) return;
  try{
    await abCargarXLSX();
    const wb = XLSX.read(await f.arrayBuffer(), { type:'array' });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, defval:'' });
    if(!aoa.length){ alert('El archivo está vacío.'); return; }
    const h = abEncabezadoExacto(aoa);
    if(h){
      const items = abConstruirItems(aoa, h.hr, h.iN, h.iK, 0);
      if(!items.length){ alert('El archivo no tiene productos debajo de los encabezados.'); return; }
      if(!confirm('Se cargarán '+items.length.toLocaleString('es-CL')+' productos (columnas Producto y SKU) y reemplazarán al maestro actual para todo el equipo. ¿Continuar?')) return;
      await abGuardarMaestro(items, f.name);
      return;
    }
    abAbrirMapeo(aoa, f.name);
  }catch(err){ alert('No se pudo leer el archivo: ' + err.message); }
}
function abDetectarEncabezado(aoa){
  const re = /sku|c[oó]d|nombre|producto|descrip|art[ií]culo/i;
  for(let i=0;i<Math.min(15,aoa.length);i++){
    const celdas = aoa[i].filter(c=>String(c).trim()!=='');
    if(celdas.length>=2 && celdas.some(c=>re.test(String(c)))) return i;
  }
  return 0;
}
function abElegirCol(headers, patrones){
  for(const p of patrones){ const i = headers.findIndex(h=>p.test(h)); if(i!==-1) return i; }
  return -1;
}
function abAbrirMapeo(aoa, archivo){
  const hr = abDetectarEncabezado(aoa);
  let ncol = aoa[hr].length;
  for(let i=hr+1;i<Math.min(aoa.length,hr+30);i++) ncol = Math.max(ncol, aoa[i].length);
  const headers = [];
  for(let c=0;c<ncol;c++){
    const h = String(aoa[hr][c]==null?'':aoa[hr][c]).trim();
    headers.push(h || ('Columna '+(c+1)));
  }
  abMapeo = { aoa:aoa, hr:hr, archivo:archivo };
  const opts = headers.map((h,i)=>'<option value="'+i+'">'+escapeHtml(h)+'</option>').join('');
  showModal(`
    <h3>Cargar maestro de productos</h3>
    <p class="subt">${escapeHtml(archivo)} · no se encontraron las columnas "Producto" y "SKU", elige cuáles usar.</p>
    <div class="field"><label class="field-label">Columna del producto</label><select id="ab-m-nombre" onchange="abPintarPrevia()">${opts}</select></div>
    <div class="field"><label class="field-label">Columna del SKU</label><select id="ab-m-sku" onchange="abPintarPrevia()">${opts}</select></div>
    <div class="subt">Vista previa (así se verá en el autocompletado)</div>
    <table class="ab-prev"><thead><tr><th>Nombre</th><th>SKU</th></tr></thead><tbody id="ab-m-prev"></tbody></table>
    <div class="modal-actions">
      <button class="ghost" onclick="abMapeo=null;closeModal()">Cancelar</button>
      <button class="primary" onclick="abConfirmarMapeo()">Cargar maestro</button>
    </div>
  `);
  const iN = abElegirCol(headers,[/^nombre$/i,/nombre/i,/^producto$/i,/producto/i,/descrip/i,/art[ií]culo/i]);
  const iK = abElegirCol(headers,[/^sku$/i,/sku/i,/^c[oó]digo$/i,/c[oó]digo(?!.*barra)/i,/c[oó]d/i]);
  document.getElementById('ab-m-nombre').value = String(iN>=0 ? iN : 0);
  document.getElementById('ab-m-sku').value = String(iK>=0 ? iK : (headers.length>1?1:0));
  abPintarPrevia();
}
function abItemsDelMapeo(limite){
  return abConstruirItems(abMapeo.aoa, abMapeo.hr, +document.getElementById('ab-m-nombre').value, +document.getElementById('ab-m-sku').value, limite);
}
function abPintarPrevia(){
  const it = abItemsDelMapeo(5);
  document.getElementById('ab-m-prev').innerHTML = it.length
    ? it.map(([n,k])=>'<tr><td>'+escapeHtml(n)+'</td><td>'+escapeHtml(k)+'</td></tr>').join('')
    : '<tr><td colspan="2">Sin datos con esta selección de columnas.</td></tr>';
}
async function abConfirmarMapeo(){
  const items = abItemsDelMapeo(0);
  if(!items.length){ alert('Con esas columnas no se encontró ningún producto. Revisa la selección.'); return; }
  const archivo = abMapeo.archivo;
  abMapeo = null;
  closeModal();
  await abGuardarMaestro(items, archivo);
}

// Llega un cambio del servidor con la pestaña abierta: se repinta la tabla, salvo que alguien esté escribiendo en ella
function abRefrescarTabla(){

          <th class="num" style="width:90px;">Cantidad necesaria</th>
          <th style="width:120px;">Proveedor</th>
          <th style="width:17%;">Observación abastecimiento</th>
          <th style="width:120px;">Estado</th>
          <th style="width:36px;"></th>
        </tr></thead>
        <tbody id="ab-tbody"></tbody>
      </table>
    </div>
  `;
  const tb = document.getElementById('ab-tbody');
  tb.addEventListener('input', abOnInput);
  tb.addEventListener('change', abOnChange);
  tb.addEventListener('click', abOnClick);
  tb.addEventListener('keydown', abOnKeydown);
  tb.addEventListener('focusout', (e)=>{
    if(e.target.dataset && e.target.dataset.f==='producto') setTimeout(abCerrarAC, 0);
    // al salir de la tabla se aplican los cambios de otros que llegaron mientras se escribía
    setTimeout(()=>{ if(abRefrescoPendiente && !tb.contains(document.activeElement)) abPintarFilas(); }, 0);
  });
  abPintarFilas();
}

/* Botón copiar SKU */
const AB_ICONO_COPIAR = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>';
const AB_ICONO_OK = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
function abBtnCopiar(){ return '<button type="button" class="ab-copy" data-act="copy" title="Copiar SKU">'+AB_ICONO_COPIAR+'</button>'; }
async function abCopiar(btn, texto){
  texto = String(texto||'').trim();
  if(!texto) return;
  try{ await navigator.clipboard.writeText(texto); }
  catch(e){ // respaldo para navegadores sin acceso al portapapeles
    const t = document.createElement('textarea');
    t.value = texto; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  }
  btn.innerHTML = AB_ICONO_OK; btn.classList.add('ok'); btn.title = 'Copiado';
  setTimeout(()=>{ btn.innerHTML = AB_ICONO_COPIAR; btn.classList.remove('ok'); btn.title = 'Copiar SKU'; }, 1200);
}

/* Resueltos y Rechazados: se guardan por mes en 'abastecimiento:resueltos:YYYY-MM' y
   'abastecimiento:rechazados:YYYY-MM', según el mes en que se agregó la fila */
const AB_ARCHIVOS = {
  resueltos:  { estado:'Resuelto',  at:'resueltoAt',  por:'resueltoPor',  titulo:'Resueltos',  plural:'resueltos',  col:'Resuelto' },
  rechazados: { estado:'Rechazado', at:'rechazadoAt', por:'rechazadoPor', titulo:'Rechazados', plural:'rechazados', col:'Rechazado' }
};
function abArchivoDe(estado){ return estado==='Resuelto' ? 'resueltos' : (estado==='Rechazado' ? 'rechazados' : null); }
function abMesDe(r){
  const d = r && r.creadoAt ? new Date(r.creadoAt) : new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
async function abLeerMes(tipo, mes){
  const { data, error } = await sb.from('kv_store').select('value').eq('key','abastecimiento:'+tipo+':'+mes).maybeSingle();
  if(error) throw error;
  return (data && Array.isArray(data.value)) ? data.value : [];
}
// Pasa las filas marcadas como Resuelto o Rechazado desde la lista de pendientes a su mes.
// Se lee la versión más reciente del mes justo antes de escribir, para no pisar lo que otro haya archivado.
async function abMoverArchivados(){
  if(abMoviendo) return;
  const listas = state.abastecimiento.filter(r=>abArchivoDe(r.estado));
  if(!listas.length) return;
  abMoviendo = true;
  try{
    const grupos = {};
    listas.forEach(r=>{
      const tipo = abArchivoDe(r.estado), a = AB_ARCHIVOS[tipo];
      if(!r[a.at]){ r[a.at] = new Date().toISOString(); r[a.por] = state.whoami||'—'; }
      if(!r.creadoAt) r.creadoAt = new Date().toISOString(); // filas antiguas sin fecha: quedan en el mes actual
      const g = tipo+':'+abMesDe(r);
      (grupos[g] = grupos[g] || []).push(r);
    });
    const movidas = [];
    for(const g of Object.keys(grupos)){
      const [tipo, mes] = g.split(':');
      let lista;
      try{ lista = await abLeerMes(tipo, mes); }catch(e){ console.error('no se pudo leer', g, e); continue; }
      grupos[g].forEach(r=>{ if(!lista.some(x=>x.id===r.id)) lista.push(r); });
      const ok = await storageSet('abastecimiento:'+g, lista, true);
      if(!ok) continue; // queda en pendientes con su estado y se reintenta en el próximo refresco
      abResCache[g] = lista;
      grupos[g].forEach(r=>movidas.push(r.id));
    }
    if(movidas.length){
      state.abastecimiento = state.abastecimiento.filter(r=>!movidas.includes(r.id));
      movidas.forEach(id=>abBorradas.add(id));
      abGuardar(); abFlushGuardado();
      renderTabs();
      // la fila archivada sale de la tabla aunque alguien esté escribiendo en otra
      movidas.forEach(id=>{ const tr = document.querySelector('#ab-tbody tr[data-id="'+id+'"]'); if(tr) tr.remove(); });
      if(abMontado){ if(AB_ARCHIVOS[abSub]) abPintarArchivo(); else abRefrescarTabla(); }
    }
  }finally{ abMoviendo = false; }
}
async function abVolverAPendientes(tipo, id, mes){
  if(!confirm('¿Devolver este producto a Pendientes?')) return;
  let lista;
  try{ lista = await abLeerMes(tipo, mes); }catch(e){ alert('No se pudo conectar con el servidor. Intenta de nuevo.'); return; }
  const r = lista.find(x=>x.id===id);
  if(!r) return;
  const resto = lista.filter(x=>x.id!==id);
  const ok = await storageSet('abastecimiento:'+tipo+':'+mes, resto, true);
  if(!ok){ alert('No se pudo guardar el cambio. Intenta de nuevo.'); return; }
  abResCache[tipo+':'+mes] = resto;
  const a = AB_ARCHIVOS[tipo];
  const fila = Object.assign({}, r, { estado:'Pendiente' });
  delete fila[a.at]; delete fila[a.por];
  state.abastecimiento.push(fila);
  abNuevas.add(fila.id);
  abGuardar(); abFlushGuardado();
  renderTabs();
  abPintarArchivo();
}
function abRenderArchivo(){
  const a = AB_ARCHIVOS[abSub];
  document.getElementById('ab-body').innerHTML = `
    <div class="ab-toolbar">
      <label for="ab-res-mes">Mes</label>
      <input type="month" id="ab-res-mes" value="${abResMes}" onchange="abResMes=this.value||todayStr().slice(0,7);abCargarArchivo()">
      <span class="ab-conteo" id="ab-res-conteo"></span>
      <span class="ab-grow"></span>
      <button class="ghost" onclick="abExportarMes()">Exportar mes a Excel</button>
    </div>
    <div class="tabla-wrap">
      <table class="ab-tabla">
        <thead><tr>
          <th style="width:88px;">Agregado</th>
          <th style="width:120px;">${a.col}</th>
          <th style="width:95px;">Plataforma</th>
          <th style="width:100px;">Envío / Retiro</th>
          <th style="width:90px;">N° de pedido</th>
          <th>Nombre producto faltante</th>
          <th class="num" style="width:135px;">SKU</th>
          <th class="num" style="width:75px;">Cantidad</th>
          <th style="width:95px;">Proveedor</th>
          <th style="width:17%;">Observación abastecimiento</th>
          <th style="width:36px;"></th>
        </tr></thead>
        <tbody id="ab-res-tbody"><tr><td class="ab-vacio" colspan="11">Cargando…</td></tr></tbody>
      </table>
    </div>
  `;
  document.getElementById('ab-res-tbody').addEventListener('click', (e)=>{
    const b = e.target.closest('[data-act]');
    if(!b) return;
    if(b.dataset.act==='copy') abCopiar(b, b.dataset.sku);
    if(b.dataset.act==='volver') abVolverAPendientes(abSub, b.dataset.id, abResMes);
  });
  abCargarArchivo();
}
async function abCargarArchivo(){
  const tipo = abSub, mes = abResMes, g = tipo+':'+mes;
  if(!AB_ARCHIVOS[tipo]) return;
  try{ abResCache[g] = await abLeerMes(tipo, mes); }
  catch(e){ console.error('no se pudo leer', g, e); if(!abResCache[g]){ abPintarArchivo('No se pudo conectar con el servidor.'); return; } }
  if(tipo===abSub && mes===abResMes) abPintarArchivo();
}
function abFechaCorta(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function abArchivoOrdenado(){
  return (abResCache[abSub+':'+abResMes]||[]).slice().sort((a,b)=>String(a.creadoAt||'').localeCompare(String(b.creadoAt||'')));
}
function abColorPlat(v){ return v==='BUHO' ? 'var(--naranjo)' : (v==='WHATSAPP' ? '#1e8e4f' : 'var(--turquesa)'); }
function abPintarArchivo(msg){
  const tb = document.getElementById('ab-res-tbody');
  const a = AB_ARCHIVOS[abSub];
  if(!tb || !a) return;
  const rows = abArchivoOrdenado();
  const cont = document.getElementById('ab-res-conteo');
  if(cont) cont.innerHTML = '<b>'+rows.length+'</b> productos '+a.plural+' en el mes';
  if(msg || !rows.length){
    tb.innerHTML = '<tr><td class="ab-vacio" colspan="11">'+escapeHtml(msg || 'No hay productos '+a.plural+' en este mes.')+'</td></tr>';
    return;
  }
  tb.innerHTML = rows.map(r=>'<tr>'
    + '<td class="ab-txt">'+abFechaCorta(r.creadoAt)+'</td>'
    + '<td class="ab-txt">'+abFechaCorta(r[a.at])+'<div class="ab-meta">'+escapeHtml(r[a.por]||'')+'</div></td>'
    + '<td class="ab-txt"><b style="color:'+abColorPlat(r.plataforma)+'">'+escapeHtml(r.plataforma)+'</b></td>'
    + '<td class="ab-txt">'+escapeHtml(r.envio)+'</td>'
    + '<td class="ab-txt">'+escapeHtml(r.pedido)+'</td>'
    + '<td class="ab-txt">'+escapeHtml(r.producto)+'</td>'
    + '<td class="ab-txt"><div class="ab-sku"><span>'+escapeHtml(r.sku)+'</span>'+(r.sku ? abBtnCopiar().replace('data-act="copy"','data-act="copy" data-sku="'+escapeHtml(r.sku)+'"') : '')+'</div></td>'
    + '<td class="ab-txt" style="text-align:right;">'+escapeHtml(r.cantidad)+'</td>'
    + '<td class="ab-txt">'+escapeHtml(r.proveedor)+'</td>'
    + '<td class="ab-txt">'+escapeHtml(r.obs)+'</td>'
    + '<td><button class="ab-x" data-act="volver" data-id="'+r.id+'" title="Devolver a Pendientes">↩</button></td>'
    + '</tr>').join('');
}
async function abExportarMes(){
  const a = AB_ARCHIVOS[abSub];
  if(!a) return;
  try{ await abCargarXLSX(); }catch(err){ alert(err.message); return; }
  const data = [['Fecha agregado','Fecha '+a.col.toLowerCase(),a.col+' por','Plataforma','Envío / Retiro','N° de pedido','Nombre producto faltante','SKU','Cantidad necesaria','Proveedor','Observación abastecimiento']];
  abArchivoOrdenado().forEach(r=>data.push([abFechaCorta(r.creadoAt),abFechaCorta(r[a.at]),r[a.por]||'',r.plataforma,r.envio,r.pedido,r.producto,r.sku,r.cantidad,r.proveedor,r.obs]));
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:12},{wch:12},{wch:14},{wch:11},{wch:14},{wch:14},{wch:44},{wch:16},{wch:10},{wch:12},{wch:50}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, a.titulo+' '+abResMes);
  XLSX.writeFile(wb, 'abastecimiento_'+abSub+'_'+abResMes+'.xlsx');
}
function abRemotoArchivo(key){
  const g = key.slice('abastecimiento:'.length); // 'resueltos:YYYY-MM' o 'rechazados:YYYY-MM'
  if(abMontado && g===abSub+':'+abResMes) abCargarArchivo();
  else delete abResCache[g];
}

function abOnInput(e){
  const el = e.target, f = el.dataset.f;
  if(!f || el.tagName==='SELECT') return;
  const r = abFilaDe(el); if(!r) return;
  r[f] = el.value;
  if(f==='producto'){
    // si el SKU venía del autocompletado y se cambia el nombre, se limpia para no dejar un SKU que ya no corresponde
    if(r.skuAuto){ r.sku = ''; r.skuAuto = false; el.closest('tr').querySelector('[data-f="sku"]').value = ''; abMarcar(r.id,'sku'); abMarcar(r.id,'skuAuto'); }
    abAbrirAC(el, r.id);
  }
  if(f==='sku'){ r.skuAuto = false; abMarcar(r.id,'skuAuto'); }
  if(f==='obs') abAutoGrow(el);
  abMarcar(r.id, f);
}
function abOnChange(e){
  const el = e.target;
  if(el.tagName!=='SELECT') return;
  const r = abFilaDe(el); if(!r) return;
  const f = el.dataset.f;
  r[f] = el.value;
  if(f==='plataforma') el.className = 'ab-sel plat '+abClsPlat(r.plataforma);
  abMarcar(r.id, f);
  if(f==='estado'){
    el.className = 'ab-sel est '+abClsEst(r.estado);
    const a = AB_ARCHIVOS[abArchivoDe(r.estado)];
    if(a){
      r[a.at] = new Date().toISOString(); r[a.por] = state.whoami||'—';
      abMarcar(r.id, a.at); abMarcar(r.id, a.por);
      setTimeout(abMoverArchivados, 350); // se deja ver el cambio de color antes de que la fila pase a su subpestaña
    }
  }
}
function abOnClick(e){
  const c = e.target.closest('[data-act="copy"]');
  if(c){ const r = abFilaDe(c); if(r) abCopiar(c, r.sku); return; }
  const b = e.target.closest('[data-act="del"]');
  if(!b) return;
  const r = abFilaDe(b); if(!r) return;
  if(!confirm('¿Eliminar esta fila?')) return;
  state.abastecimiento = state.abastecimiento.filter(x=>x.id!==r.id);
  abBorradas.add(r.id);
  abPintarFilas(); renderTabs();
  abGuardar(); abFlushGuardado();
}
function abAgregarFila(){
  const r = abNuevaFila();
  state.abastecimiento.push(r);
  abNuevas.add(r.id);
  abPintarFilas(); renderTabs();
  abGuardar(); abFlushGuardado();
  const tr = document.querySelector('#ab-tbody tr[data-id="'+r.id+'"]');
  if(tr){ tr.scrollIntoView({block:'center'}); tr.querySelector('[data-f="pedido"]').focus(); }
}

/* Autocompletado */
let abAcRes = [], abAcIdx = -1, abAcRow = null, abAcEl = null;
function abAcBox(){
  let box = document.getElementById('ab-ac');
  if(!box){
    box = document.createElement('div');
    box.id = 'ab-ac';
    document.body.appendChild(box);
    box.addEventListener('mousedown', (e)=>{
      e.preventDefault(); // mantiene el foco en el cuadro de texto (y permite usar la barra de scroll de la lista)
      const it = e.target.closest('.ab-ac-item');
      if(it) abElegirAC(+it.dataset.i);
    });
    box.addEventListener('mousemove', (e)=>{
      const it = e.target.closest('.ab-ac-item');
      if(!it) return;
      const i = +it.dataset.i;
      if(i!==abAcIdx){ abAcIdx = i; abMarcarAC(false); }
    });
    window.addEventListener('scroll', (e)=>{ if(e.target===box || box.contains(e.target)) return; abCerrarAC(); }, true);
    window.addEventListener('resize', abCerrarAC);
  }
  return box;
}
function abAbrirAC(el, rowId){
  abAcEl = el; abAcRow = rowId;
  if(abNorm(el.value).length < 2){ abCerrarAC(); return; }
  if(!abMaestro.length){
    abAcRes = [];
    abPintarAC(abMaestroCargado ? 'Carga el Excel maestro para autocompletar el SKU.' : 'Cargando maestro…');
    return;
  }
  abAcRes = abBuscar(el.value);
  abAcIdx = abAcRes.length ? 0 : -1;
  abPintarAC(abAcRes.length ? null : 'Sin coincidencias en el maestro: se guardará lo que escribas.');
}
function abPintarAC(msg){
  const box = abAcBox();
  box.innerHTML = msg
    ? '<div class="ab-ac-msg">'+escapeHtml(msg)+'</div>'
    : abAcRes.map((it,i)=>'<div class="ab-ac-item'+(i===abAcIdx?' on':'')+'" data-i="'+i+'"><span>'+escapeHtml(it.n)+'</span><span class="ab-ac-k">'+escapeHtml(it.k)+'</span></div>').join('');
  box.style.display = 'block';
  const r = abAcEl.getBoundingClientRect();
  box.style.left = r.left+'px';
  box.style.minWidth = Math.max(r.width, 420)+'px';
  box.style.top = (r.bottom+2)+'px';
  const h = box.offsetHeight;
  if(r.bottom+2+h > window.innerHeight && r.top-h-2 > 0) box.style.top = (r.top-h-2)+'px';
}
function abCerrarAC(){
  const box = document.getElementById('ab-ac');
  if(box) box.style.display = 'none';
  abAcRes = []; abAcIdx = -1;
}
function abMarcarAC(desplazar){
  const box = abAcBox();
  box.querySelectorAll('.ab-ac-item').forEach((d,i)=>d.classList.toggle('on', i===abAcIdx));
  if(desplazar){ const on = box.querySelector('.ab-ac-item.on'); if(on) on.scrollIntoView({block:'nearest'}); }
}
function abElegirAC(i){
  const it = abAcRes[i]; if(!it) return;
  const r = state.abastecimiento.find(x=>x.id===abAcRow); if(!r) return;
  r.producto = it.n; r.sku = it.k; r.skuAuto = true;
  ['producto','sku','skuAuto'].forEach(f=>abMarcar(r.id, f));
  const tr = abAcEl.closest('tr');
  tr.querySelector('[data-f="producto"]').value = it.n;
  tr.querySelector('[data-f="sku"]').value = it.k;
  abCerrarAC();
  tr.querySelector('[data-f="cantidad"]').focus();
}
function abOnKeydown(e){
  const el = e.target;
  if(!el.dataset || el.dataset.f!=='producto') return;
  const box = document.getElementById('ab-ac');
  const abierto = box && box.style.display==='block' && abAcRes.length;
  if(!abierto){ if(e.key==='Escape') abCerrarAC(); return; }
  if(e.key==='ArrowDown'){ e.preventDefault(); abAcIdx = (abAcIdx+1)%abAcRes.length; abMarcarAC(true); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); abAcIdx = (abAcIdx-1+abAcRes.length)%abAcRes.length; abMarcarAC(true); }
  else if(e.key==='Enter'){ e.preventDefault(); abElegirAC(abAcIdx); }
  else if(e.key==='Escape'){ abCerrarAC(); }
}

/* Exportar */
async function abExportar(){
  try{ await abCargarXLSX(); }catch(err){ alert(err.message); return; }
  const data = [['Plataforma','Envío / Retiro','N° de pedido','Nombre producto faltante','SKU','Cantidad necesaria','Proveedor','Observación abastecimiento','Estado']];
  state.abastecimiento.filter(r=>!abArchivoDe(r.estado)).forEach(r=>data.push([r.plataforma,r.envio,r.pedido,r.producto,r.sku,r.cantidad,r.proveedor,r.obs,r.estado]));
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:11},{wch:14},{wch:14},{wch:44},{wch:16},{wch:10},{wch:12},{wch:50},{wch:11}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Abastecimiento');
  XLSX.writeFile(wb, 'abastecimiento_'+todayStr()+'.xlsx');
}

/* ---- Init ---- */
async function arrancarApp(){
  const { data: { user } } = await sb.auth.getUser();
  state.whoami = nombreDesdeEmail(user ? user.email : '');
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  await loadAll();
  render();
  setupRealtime();
  setInterval(refreshBackground, 20000); // red de respaldo, por si la conexión en tiempo real se corta
  scheduleFlush();
}
(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    await arrancarApp();
  } else {
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    renderLoginScreen();
  }
})();

function scheduleFlush(){
  const delay = Math.min(3000 * Math.max(1, failStreak), 15000);
  setTimeout(async ()=>{
    await flushPendingSaves();
    scheduleFlush();
  }, delay);
}
